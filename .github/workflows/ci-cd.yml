name: Full CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - "27017:27017"
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
          MONGO_INITDB_DATABASE: my_db
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        run: |
          cd backend
          npm install

      - name: Install Netcat
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd

      - name: Wait for Backend
        run: |
          for i in {1..15}; do
            if nc -z 127.0.0.1 27017; then
              echo "MONGO DB ready"
              exit 0
            fi
            echo "Waiting for connection.."
            sleep 2
          done
          echo "Mongo failed"
          exit 1

      - name: Start Backend and test api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 27017
          DB_USER: root
          DB_PASSWORD: root 
          DB_NAME: my_db
          PORT: 5000
        run: |
          node backend/server.js &
          for i in {1..10}; do
            if curl -f http://127.0.0.1:5000; then
              echo "API working"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed"
          exit 1

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MONGO_INITDB_ROOT_USERNAME=admin">>.env
          echo "MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MDB_PASS }}">>.env
          echo "MONGO_INTDB_DATABASE=my_db">>.env
          echo "DB_HOST=mongodb">>.env
          echo "DB_PORT=27017">>.env
          echo "DB_USER=admin">>.env
          echo "DB_PASSWORD=${{ secrets.MDB_PASS }}">>.env
          echo "DB_NAME=my_db">>.env
          echo "PORT=5000">>.env
          echo "NODE_ENV=production">>.env
          
      - name: Start full stack
        run: docker compose up -d

      - name: Wait for services 
        run: sleep 15

      - name: Test api
        run: curl -f http://127.0.0.1:3000/api/ || exit 1

      - name: Shutdown
        run: docker compose down --remove-orphans

  build-push:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: set image tag
        id: vars
        run: echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build backend image
        run: |
         docker build \
         --cache-from ${{ secrets.DOCKER_USERNAME }}/backend:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/backend:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/backend:${{ steps.vars.outputs.TAG }} ./backend

      - name: Build frontend image
        run: |
          docker build \
          --cache-from ${{ secrets.DOCKER_USERNAME }}/frontend:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/frontend:${{ steps.vars.outputs.TAG }} ./frontend

      - name: push frontend image
        run:  |
           docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
           docker push ${{ secrets.DOCKER_USERNAME }}/frontend:${{ steps.vars.outputs.TAG }}

      - name: backend image
        run: |
            docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest
            docker push ${{ secrets.DOCKER_USERNAME }}/backend:${{ steps.vars.outputs.TAG }}

            

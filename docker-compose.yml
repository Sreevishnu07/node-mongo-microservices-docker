services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD","mongosh","--eval","db.runCommand({ping: 1})"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  backend:
    build: ./backend
    container_name: backend3
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5001:5000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend3
    restart: unless-stopped
    ports:
      - "3000:80"
    
volumes:
  mongo_data: